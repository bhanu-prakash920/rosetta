{{- if .Values.networkPolicy.enabled }}
# Every pod of the release: no inbound traffic, outbound only to what is listed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rosetta.fullname" . }}-default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rosetta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rosetta.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    {{- if .Values.networkPolicy.allowDns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.api.enabled }}
---
# The API is the only component that accepts connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rosetta.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rosetta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "rosetta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.apiIngressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: http
{{- end }}
{{- end }}
