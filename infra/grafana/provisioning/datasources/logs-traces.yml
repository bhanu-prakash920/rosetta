# Logs (Loki) and traces (Tempo), linked both ways: a log line with a trace id
# opens the trace, and a span opens the log lines of the same trace.
apiVersion: 1

datasources:
  - name: Loki
    uid: rosetta-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: rosetta-tempo
          url: "$${__value.raw}"
  - name: Tempo
    uid: rosetta-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: rosetta-loki
        filterByTraceID: true
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
      serviceMap:
        datasourceUid: rosetta-prometheus
