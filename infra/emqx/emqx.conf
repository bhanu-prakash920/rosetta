## EMQX 5.8 configuration for device intake with mutual TLS.
##
## Mounted over /opt/emqx/etc/emqx.conf by infra/emqx/docker-compose.mtls.yml.
## The node cookie and the dashboard password are not in this file: they are
## injected through EMQX_NODE__COOKIE and EMQX_DASHBOARD__DEFAULT_PASSWORD,
## and environment variables override what is written here.
##
## Certificates are read from /opt/emqx/etc/certs/rosetta, which is the
## git-ignored directory infra/emqx/certs created by scripts/make_certs.sh.
## In production they come from your PKI, mounted as a secret.

node {
  name = "emqx@emqx.rosetta.internal"
  ## placeholder, always overridden by EMQX_NODE__COOKIE
  cookie = "overridden-by-environment"
  data_dir = "data"
}

cluster {
  name = rosetta
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

## ---------------------------------------------------------------- listeners
## No plain-text MQTT. Every client, device or service, presents a certificate.
listeners.tcp.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 1024000
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/rosetta/ca.pem"
    certfile   = "/opt/emqx/etc/certs/rosetta/server.pem"
    keyfile    = "/opt/emqx/etc/certs/rosetta/server.key"
    ## mutual TLS: ask for a client certificate, refuse the handshake without one
    verify = verify_peer
    fail_if_no_peer_cert = true
    ## The Rosetta gateway and simulator accept TLS 1.3 only (mqtt_gateway.py).
    ## TLS 1.2 stays enabled for devices in the field that cannot do 1.3.
    versions = ["tlsv1.3", "tlsv1.2"]
  }
}

## ----------------------------------------------------------------- identity
mqtt {
  ## The identity of a client is the common name of its certificate. Whatever
  ## user name the client sends is replaced by it.
  peer_cert_as_username = cn

  ## Device certificates carry the common name "<source>.<device>", for example
  ## "helix.hx-0000012". Both parts become client attributes that acl.conf uses.
  ## Source keys contain no dot. Device ids contain hyphens, which is why the
  ## separator is a dot.
  client_attrs_init = [
    { expression = "nth(1, tokens(cn, '.'))", set_as_attr = "source" },
    { expression = "nth(2, tokens(cn, '.'))", set_as_attr = "device" }
  ]
}

## ------------------------------------------------------------ authorisation
authorization {
  ## what no rule allows is refused
  no_match = deny
  deny_action = disconnect
  sources = [
    { type = file, enable = true, path = "/opt/emqx/etc/acl.conf" }
  ]
}
