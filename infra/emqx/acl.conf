%% Access rules for EMQX. Erlang terms, evaluated top to bottom, first match wins.
%% Mounted over /opt/emqx/etc/acl.conf by infra/emqx/docker-compose.mtls.yml.
%%
%% "username" is the common name of the client certificate
%% (mqtt.peer_cert_as_username = cn in emqx.conf). A client cannot choose it.

%% The Rosetta gateway reads every device topic through a shared subscription.
{allow, {username, "gateway"}, subscribe, ["$share/gateway/oem/+/+/telemetry", "oem/+/+/telemetry"]}.

%% The load generator stands in for the whole fleet with one connection
%% (rosetta/simulator/transports.py). Do not issue this certificate outside a test.
{allow, {username, "simulator"}, publish, ["oem/+/+/telemetry"]}.

%% A device publishes to its own topic and to nothing else. Its certificate has
%% the common name "<source>.<device>", split into client attributes by
%% mqtt.client_attrs_init. The certificate "helix.hx-0000012" may publish to
%% oem/helix/hx-0000012/telemetry only, so it cannot speak for another device
%% and cannot claim to be another source.
{allow, all, publish, ["oem/${client_attrs.source}/${client_attrs.device}/telemetry"]}.

%% Everything else is refused: no subscriptions for devices, no $SYS, no wildcards.
{deny, all}.
