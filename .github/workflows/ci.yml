# Rosetta continuous integration.
#
# Every push and every pull request runs: lint, unit tests, integration tests,
# the coverage gate (80%), BDD, the chaos test, the front end, the security
# scans, the infrastructure checks and the image build.
# The load test is heavy and runs only when started by hand (Actions > CI > Run workflow).
#
# Actions are pinned to a commit. The comment after each one names the release
# that commit belongs to. Update both together.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      load_test:
        description: Run the load test
        type: boolean
        default: false
      load_seconds:
        description: Duration of each load test phase, in seconds
        type: string
        default: "60"
      load_users:
        description: Concurrent users for the API load test
        type: string
        default: "60"

# The workflow reads the repository and nothing else. No job writes to it, opens
# issues or publishes packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  IMAGE: rosetta:ci

jobs:
  # ---------------------------------------------------------------------- lint
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: pip install "ruff>=0.6,<1"
      - name: ruff
        run: ruff check --output-format=github rosetta tests scripts infra

  # ---------------------------------------------------------------- unit tests
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # Coverage of the unit tests alone is reported here and not gated: the
      # adapters, the API and the pipeline are covered by the integration tests.
      # The 80% gate is the job "coverage", which measures all of them together.
      - name: pytest tests/unit
        run: >-
          pytest tests/unit
          --cov=rosetta --cov-branch
          --cov-report=term:skip-covered
          --cov-report=xml:reports/coverage-unit.xml
          --junitxml=reports/unit.xml
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------ coverage
  coverage:
    name: Coverage, 80% or the build fails
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit, integration, contract and security tests with coverage
        run: >-
          pytest tests -m "not infra"
          --cov=rosetta --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/htmlcov
          --cov-fail-under=80
          --junitxml=reports/all.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------- integration tests
  integration:
    name: Integration and contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration and contract tests, local adapters
        run: pytest tests/integration tests/contract -m "not infra" --ignore=tests/contract/pact --junitxml=reports/integration.xml
      # Pact: the pipeline consumers rewrite their pacts, which must match the
      # committed ones. Then the API, the normaliser and the processor are verified
      # against every pact, including the one the web console job checks.
      - name: Pact, consumers
        run: pytest tests/contract/pact -k consumer --junitxml=reports/pact-consumers.xml
      - name: Pact files are up to date
        run: git diff --exit-code tests/contract/pacts
      - name: Pact, providers
        run: pytest tests/contract/pact -k provider --junitxml=reports/pact-providers.xml
      # Kafka, PostgreSQL and Redis in containers (Testcontainers). The runner has
      # Docker, so these tests run here and are not skipped.
      - name: Integration tests, production adapters
        run: pytest tests/integration -m infra -rs --junitxml=reports/infra.xml
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  # ----------------------------------------------------------------------- BDD
  bdd:
    name: BDD (behave)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: behave
        run: |
          mkdir -p reports
          behave tests/bdd --junit --junit-directory reports/bdd
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------- chaos
  chaos:
    name: Chaos (kill and recover)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Kill pipeline processes under load and check the books
        run: |
          mkdir -p reports
          python tests/chaos/kill_and_recover.py --vehicles 10000 --seconds 30 --out reports/chaos.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------ frontend
  frontend:
    name: Front end (typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run --passWithNoTests --exclude "**/*.pact.test.ts"
      - name: Pact, web console as consumer of the API
        run: npm run test:pact
      - name: The web console pact is up to date
        run: git diff --exit-code ../tests/contract/pacts/rosetta-web-console-rosetta-api.json
      - name: Build
        run: npm run build
      - name: Upload the built UI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ security
  security:
    name: Security (bandit, pip-audit, npm audit, Semgrep, Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: |
          # the runner's Python ships an old setuptools that pip-audit would report
          pip install -U pip setuptools
          pip install -e ".[dev]"
          mkdir -p reports

      # Every scan runs even when an earlier one failed (if: always()), so one
      # run shows all findings. One failed scan is enough to fail the job.
      - name: Security tests of the API
        id: tests
        if: always()
        run: pytest tests/security --junitxml=reports/security-tests.xml

      - name: bandit (static analysis of the Python code)
        id: bandit
        if: always()
        run: |
          bandit -c pyproject.toml -r rosetta -f json -o reports/bandit.json || true
          bandit -c pyproject.toml -r rosetta

      - name: pip-audit (known vulnerabilities in Python dependencies)
        id: pip_audit
        if: always()
        run: |
          pip-audit --format json --output reports/pip-audit.json || true
          pip-audit --desc

      - name: npm audit (known vulnerabilities in front-end dependencies)
        id: npm_audit
        if: always()
        working-directory: web
        run: |
          npm audit --audit-level=high --json > ../reports/npm-audit.json || true
          npm audit --audit-level=high

      - name: Semgrep
        id: semgrep
        if: always()
        run: |
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install semgrep==1.178.0
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan \
            --config p/python --config p/security-audit --config p/secrets --config p/dockerfile \
            --exclude web/node_modules --exclude web/dist --exclude tests --exclude design \
            --metrics off --error --timeout 120 \
            --sarif-output reports/semgrep.sarif
          # the web console: TypeScript, React and XSS rules
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan \
            --config p/typescript --config p/react --config p/javascript --config p/xss \
            --metrics off --error --timeout 120 \
            --sarif-output reports/semgrep-web.sarif web/src web/index.html web/vite.config.ts

      - name: Trivy, file system (dependencies, secrets, misconfiguration)
        id: trivy_fs
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: web/node_modules,design,.venv
          format: json
          output: reports/trivy-fs.json
          exit-code: "1"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------------ OWASP ZAP
  dast:
    name: OWASP ZAP baseline and API scans
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [frontend]
    env:
      ROSETTA_DATA_DIR: ${{ github.workspace }}/.ci-data
      ROSETTA_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Download the built UI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: Start the API (local mode, 2,000 vehicles)
        env:
          ROSETTA_RATE_LIMIT_PER_MIN: "60000"
        run: |
          python -m rosetta seed --vehicles 2000
          nohup uvicorn rosetta.api.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/system/health; then echo; exit 0; fi
            sleep 2
          done
          echo "the API did not start"; cat api.log; exit 1
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8000
          # The workflow has no permission to open issues, and must not need it.
          allow_issue_writing: false
          # Report only, until a rules file has been agreed on. Findings are in
          # the artifact. Set to true to make warnings fail the build.
          fail_action: false
          artifact_name: zap-report
          cmd_options: "-a -j"
      # Active scan of every documented operation, signed in as a platform engineer.
      # The rate limits are raised for this throwaway instance only, so the scan
      # measures the API and not the limiter (the limiter has its own tests).
      - name: Sign in for the API scan
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/token \
            -d "username=engineer@rosetta.example&password=${ROSETTA_DEMO_PASSWORD:-rosetta-demo-2026}" \
            | python -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$TOKEN"
          echo "ZAP_AUTH_HEADER_VALUE=Bearer $TOKEN" >> "$GITHUB_ENV"
      - name: ZAP API scan
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        env:
          ZAP_AUTH_HEADER: Authorization
        with:
          target: docs/api/openapi.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-report
          cmd_options: "-a -j -O http://localhost:8000"
      - name: API log
        if: always()
        run: tail -n 100 api.log || true

  # --------------------------------------------------------------------- infra
  infra:
    name: Infrastructure files (Compose, Helm, Terraform, Prometheus)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The SQL inside the chart equals infra/sql
        run: cmp infra/sql/postgres_extras.sql infra/helm/rosetta/files/postgres_extras.sql
      - name: Shell scripts parse
        run: |
          sh -n infra/docker/entrypoint.sh
          bash -n scripts/make_certs.sh
      - name: Certificates can be created
        run: CERT_DIR="$RUNNER_TEMP/certs" scripts/make_certs.sh gateway simulator helix.hx-0000012
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f infra/emqx/docker-compose.mtls.yml config --quiet
          rm -f .env
      - name: helm lint and template
        run: |
          helm version
          helm lint infra/helm/rosetta
          mkdir -p reports
          helm template rosetta infra/helm/rosetta --namespace rosetta > reports/helm-rendered.yaml
          helm template rosetta infra/helm/rosetta --namespace rosetta \
            --set ingress.enabled=false --set networkPolicy.enabled=false --set seed.enabled=false \
            --set kafka.topicInit.enabled=false --set mqtt.tls.enabled=false --set serviceMonitor.enabled=true \
            > reports/helm-rendered-minimal.yaml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: terraform fmt and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Prometheus configuration and rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.4 check config /etc/prometheus/prometheus.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -c "import json; d = json.load(open('infra/grafana/dashboards/rosetta-pipeline.json')); print(len(d['panels']), 'panels')"
      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-rendered
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------- image
  docker:
    name: Docker image (build, smoke test, Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs as a non-root user and carries the UI
        run: |
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = "10001"
          docker run --rm --entrypoint test "$IMAGE" -f /app/web/dist/index.html
          docker run --rm "$IMAGE" python -c "import rosetta; print(rosetta.__version__)"
      - name: No secret is set in the image
        run: |
          docker inspect "$IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' > env.txt
          cat env.txt
          if grep -Ei '(SECRET|PASSWORD|TOKEN|API_KEY|ACCESS_KEY)=' env.txt; then
            echo "the image sets a credential in its environment"
            exit 1
          fi
      - name: Smoke test, the API becomes healthy (local mode, read-only root file system)
        run: |
          docker run -d --name rosetta-smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e ROSETTA_ENV=test -p 127.0.0.1:8000:8000 "$IMAGE" api
          for _ in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' rosetta-smoke)"
            echo "health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 4
          done
          docker logs rosetta-smoke | tail -n 30
          test "$status" = "healthy"
          curl -fsS http://127.0.0.1:8000/api/v1/system/health
          curl -fsS -o metrics.txt http://127.0.0.1:8000/metrics
          head -n 5 metrics.txt
          docker rm -f rosetta-smoke
      - name: Trivy, image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image.json
          exit-code: "1"
      - name: Upload the image scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-scan
          path: trivy-image.json
          if-no-files-found: warn
          retention-days: 30

  # ----------------------------------------------------------------- load test
  load-test:
    name: Load test (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.load_test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROSETTA_DATA_DIR: ${{ github.workspace }}/.ci-data
      ROSETTA_ENV: test
      # passed through the environment, never pasted into a script
      LOAD_SECONDS: ${{ inputs.load_seconds }}
      LOAD_USERS: ${{ inputs.load_users }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check the inputs
        run: |
          case "$LOAD_SECONDS$LOAD_USERS" in *[!0-9]*) echo "load_seconds and load_users must be numbers"; exit 1 ;; esac
          mkdir -p reports
      - name: Pipeline throughput (scripts/bench_pipeline.py)
        run: |
          python scripts/bench_pipeline.py --seconds "$LOAD_SECONDS" --label ci
          cp docs/evidence/*.json reports/ || true
      - name: API under load (locust)
        run: |
          nohup python -m rosetta up --port 8765 --vehicles 20000 > api.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8765/api/v1/system/health > /dev/null; then break; fi
            sleep 2
          done
          sleep 15
          locust -f tests/load/locustfile.py --headless -u "$LOAD_USERS" -r 20 -t "${LOAD_SECONDS}s" \
            --host http://127.0.0.1:8765 --csv reports/locust --html reports/locust.html --only-summary
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-test
          path: |
            reports/
            api.log
          if-no-files-found: warn
          retention-days: 30
