[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta"
version = "1.0.0"
description = "Universal OEM telemetry normalisation engine with an agent that onboards new formats without downtime"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "SQLAlchemy>=2.0.30,<3",
  "psycopg2-binary>=2.9,<3",
  "orjson>=3.10,<4",
  "numpy>=1.26",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "xxhash>=3.4,<4",
  "protobuf>=5,<8",
  "PyJWT[crypto]>=2.8,<3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.31",
  "confluent-kafka>=2.5,<3",
  "redis>=5,<9",
  "paho-mqtt>=2.1,<3",
  # the mapping agent drives its tools with whichever of these has a key set
  "anthropic>=1.0,<2",
  "google-genai>=1.0,<3",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  # Security floors for transitive dependencies: the oldest versions without a
  # known vulnerability (pip-audit, docs/evidence/security/README.md).
  "starlette>=1.3.1",
  "anyio>=4.14.2",
  "cryptography>=50",
  "python-dotenv>=1.2.2",
  "requests>=2.33",
  "urllib3>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3", "pytest-cov>=5", "httpx>=0.27", "behave>=1.2.6", "locust>=2.31", "fakeredis>=2.24",
  "jsonschema>=4.22", "testcontainers[kafka,postgres,redis]>=4.8", "bandit>=1.7", "pip-audit>=2.7", "ruff>=0.6",
  "pact-python>=3.4,<4",
]

[project.scripts]
rosetta = "rosetta.__main__:main"

[tool.setuptools.packages.find]
include = ["rosetta*"]

[tool.setuptools.package-data]
"rosetta.ml" = ["artifacts/*.joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
markers = [
  "infra: needs real Kafka, PostgreSQL or Redis through Docker (Testcontainers). Skipped when Docker is not running.",
  "slow: takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["rosetta"]
branch = true
omit = [
  "rosetta/adapters/kafka_broker.py",   # exercised by the infra suite against a real broker
  "rosetta/adapters/timescale.py",      # exercised by the infra suite against a real database
  "rosetta/ml/train.py",                # a training script, evaluated by its own report
  "rosetta/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
# B905: zip() without strict= is deliberate where lengths are equal by construction.
# S110/S112: the pipeline swallows exceptions only where one bad item must not stop the
#            rest (metrics, audit of reads, optional tracing); each site says why.
ignore = ["S101", "S311", "E501", "B008", "UP007", "E702", "B905", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.bandit]
exclude_dirs = ["tests", "web", ".venv", "scripts"]
# B110/B112 as for ruff S110/S112. B404/B603: the supervisor starts its own modules with a fixed argv.
skips = ["B101", "B311", "B110", "B112", "B404", "B603"]
